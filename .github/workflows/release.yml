name: Release

# Builds TypeAssist on Windows, runs the tests and publishes a GitHub release with TypeAssist-<version>.zip.
# Start it by pushing a tag like v1.4.0, or from the Actions tab ("Run workflow") with the tag to create.
# Release notes come from .github/release-notes/<tag>.md when present.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.4.0 (must match the version in src/Win/App.cs)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Test
        shell: cmd
        run: tests\run_tests.bat

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          $exeVersion = (Get-Item TypeAssist.exe).VersionInfo.ProductVersion
          if (-not $exeVersion.StartsWith($version)) { throw "Tag $version does not match exe version $exeVersion" }
          $dir = "dist/TypeAssist"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item TypeAssist.exe, README.md, README.fa.md, LICENSE, THIRD_PARTY_NOTICES.md $dir
          Compress-Archive -Path $dir -DestinationPath "TypeAssist-$version.zip" -Force
          "ZIP=TypeAssist-$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $notes = ".github/release-notes/$tag.md"
          $common = @($tag, $env:ZIP, '--title', "TypeAssist $($tag.TrimStart('v'))", '--target', "${{ github.sha }}", '--latest')
          if (Test-Path $notes) { gh release create @common --notes-file $notes }
          else { gh release create @common --generate-notes }
